<!-- 07-magnetic-iron.html — Ferro-Field Magnetic Sandbox: Drop and drag dipole magnets to align hundreds of iron filings in real-time magnetic fields. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferro-Field Magnetic Sandbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1017;
    color: #edf2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
  }
  .top {
    width: 100%;
    max-width: 1000px;
    background: #161b26;
    border: 1px solid #2b3448;
    border-radius: 14px;
    padding: 12px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .top h1 { font-size: 1.12rem; }
  .top p { font-size: 0.78rem; color: #8c99b2; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    background: #232b3d;
    color: #eef2f8;
    border: 1px solid #38445e;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { border-color: #60a5fa; }
  button.on { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  canvas#tray {
    width: 100%;
    max-width: 1000px;
    height: 540px;
    background: #090c12;
    border: 2px solid #2a3346;
    border-radius: 16px;
    cursor: grab;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  canvas#tray:active { cursor: grabbing; }
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>Ferro-Field Magnetic Sandbox</h1>
    <p>Drag bar magnets around the tray, flip polarity on double-click, and watch iron filings align to dipole fields</p>
  </div>
  <div class="controls">
    <button id="addMagBtn">+ Add Magnet</button>
    <button id="linesBtn">Field Arrows: Off</button>
    <button id="shakeBtn">Shake Tray</button>
    <button id="humBtn">Coil Hum: Off</button>
  </div>
</div>
<canvas id="tray" width="1000" height="540"></canvas>

<script>
(() => {
  const canvas = document.getElementById('tray');
  const ctx = canvas.getContext('2d');
  const linesBtn = document.getElementById('linesBtn');
  const humBtn = document.getElementById('humBtn');

  let showArrows = false;
  let magnets = [
    { x: 340, y: 270, angle: 0, strength: 1 },
    { x: 660, y: 270, angle: Math.PI, strength: 1 }
  ];

  const filings = Array.from({ length: 680 }, () => ({
    x: 20 + Math.random() * 960,
    y: 20 + Math.random() * 500,
    ang: Math.random() * Math.PI * 2
  }));

  let dragging = null, offX = 0, offY = 0;
  let audioCtx = null, humOsc = null, humGain = null, humOn = false;

  function fieldAt(x, y) {
    let bx = 0, by = 0;
    for (const m of magnets) {
      const dxAxis = Math.cos(m.angle) * 26;
      const dyAxis = Math.sin(m.angle) * 26;
      const poles = [
        { px: m.x + dxAxis, py: m.y + dyAxis, q: 1 * m.strength },
        { px: m.x - dxAxis, py: m.y - dyAxis, q: -1 * m.strength }
      ];
      for (const p of poles) {
        const dx = x - p.px;
        const dy = y - p.py;
        const r2 = dx * dx + dy * dy + 280;
        const inv = p.q / (r2 * Math.sqrt(r2));
        bx += dx * inv;
        by += dy * inv;
      }
    }
    return [bx, by];
  }

  function drawMagnet(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.angle);

    // North (red) & South (blue)
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(0, -14, 38, 28);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(-38, -14, 38, 28);

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-38, -14, 76, 28);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', 19, 0);
    ctx.fillText('S', -19, 0);
    ctx.restore();
  }

  function frame() {
    requestAnimationFrame(frame);
    ctx.fillStyle = '#090c12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Iron filings
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.6;
    for (const f of filings) {
      const [bx, by] = fieldAt(f.x, f.y);
      const mag = Math.hypot(bx, by);
      if (mag > 1e-6) {
        const target = Math.atan2(by, bx);
        let diff = target - f.ang;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        f.ang += diff * 0.25;
      }
      const len = 5.5;
      const cx = Math.cos(f.ang) * len;
      const cy = Math.sin(f.ang) * len;
      ctx.beginPath();
      ctx.moveTo(f.x - cx, f.y - cy);
      ctx.lineTo(f.x + cx, f.y + cy);
      ctx.stroke();
    }

    if (showArrows) {
      ctx.strokeStyle = 'rgba(56, 228, 174, 0.35)';
      ctx.lineWidth = 1.2;
      for (let gx = 40; gx < canvas.width; gx += 60) {
        for (let gy = 40; gy < canvas.height; gy += 60) {
          const [bx, by] = fieldAt(gx, gy);
          const ang = Math.atan2(by, bx);
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          ctx.lineTo(gx + Math.cos(ang) * 16, gy + Math.sin(ang) * 16);
          ctx.stroke();
        }
      }
    }

    magnets.forEach(drawMagnet);
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const p = getPos(e);
    for (let i = magnets.length - 1; i >= 0; i--) {
      const m = magnets[i];
      if (Math.hypot(p.x - m.x, p.y - m.y) < 42) {
        dragging = m;
        offX = p.x - m.x;
        offY = p.y - m.y;
        break;
      }
    }
  });

  canvas.addEventListener('dblclick', (e) => {
    const p = getPos(e);
    for (const m of magnets) {
      if (Math.hypot(p.x - m.x, p.y - m.y) < 42) {
        m.angle += Math.PI / 2;
        break;
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const p = getPos(e);
    dragging.x = Math.max(45, Math.min(canvas.width - 45, p.x - offX));
    dragging.y = Math.max(30, Math.min(canvas.height - 30, p.y - offY));
  });

  window.addEventListener('pointerup', () => { dragging = null; });

  document.getElementById('addMagBtn').addEventListener('click', () => {
    if (magnets.length >= 6) return;
    magnets.push({
      x: 160 + Math.random() * 680,
      y: 120 + Math.random() * 300,
      angle: Math.random() * Math.PI * 2,
      strength: 1
    });
  });

  linesBtn.addEventListener('click', () => {
    showArrows = !showArrows;
    linesBtn.textContent = showArrows ? 'Field Arrows: On' : 'Field Arrows: Off';
    linesBtn.classList.toggle('on', showArrows);
  });

  document.getElementById('shakeBtn').addEventListener('click', () => {
    filings.forEach(f => {
      f.x = 20 + Math.random() * 960;
      f.y = 20 + Math.random() * 500;
      f.ang = Math.random() * Math.PI * 2;
    });
  });

  humBtn.addEventListener('click', () => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      humOsc = audioCtx.createOscillator();
      humOsc.type = 'sine';
      humOsc.frequency.value = 60;
      humGain = audioCtx.createGain();
      humGain.gain.value = 0;
      humOsc.connect(humGain); humGain.connect(audioCtx.destination);
      humOsc.start();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    humOn = !humOn;
    humBtn.textContent = humOn ? 'Coil Hum: On' : 'Coil Hum: Off';
    humBtn.classList.toggle('on', humOn);
    humGain.gain.setTargetAtTime(humOn ? 0.04 : 0, audioCtx.currentTime, 0.05);
  });

  frame();
})();
</script>
</body>
</html>
