<!-- 10-zen-sand-rake.html — Karesansui Zen Sand Garden: Drag multi-tine rakes through shaded sand, place mossy stones, and hear soft wind chimes. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karesansui Zen Sand Garden</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141210;
    color: #efe9df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
  }
  .bar {
    width: 100%;
    max-width: 960px;
    background: #1f1c18;
    border: 1px solid #38322a;
    border-radius: 14px;
    padding: 12px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .bar h1 { font-size: 1.15rem; color: #e2d5be; }
  .bar p { font-size: 0.78rem; color: #9c9284; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    background: #2b2722;
    color: #efe9df;
    border: 1px solid #443c32;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.active { background: #84a98c; color: #0e1a11; border-color: #84a98c; }
  .tray {
    padding: 12px;
    background: #3d2e20;
    border-radius: 18px;
    border: 2px solid #594430;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    width: 100%;
    max-width: 960px;
  }
  canvas#sand {
    width: 100%;
    height: 500px;
    display: block;
    border-radius: 10px;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div class="bar">
  <div>
    <h1>Karesansui Zen Sand Garden</h1>
    <p>Drag across the sand to carve shaded rake grooves, place mossy stones, and smooth the tray</p>
  </div>
  <div class="controls">
    <button id="rakeWide" class="active">Wide Rake (5-Tine)</button>
    <button id="rakeFine">Fine Rake (9-Tine)</button>
    <button id="stoneBtn">+ Place Stone</button>
    <button id="chimeBtn">Chimes: Off</button>
    <button id="smoothBtn">Smooth Sand</button>
  </div>
</div>
<div class="tray">
  <canvas id="sand" width="936" height="500"></canvas>
</div>

<script>
(() => {
  const canvas = document.getElementById('sand');
  const ctx = canvas.getContext('2d');
  const rakeWide = document.getElementById('rakeWide');
  const rakeFine = document.getElementById('rakeFine');
  const chimeBtn = document.getElementById('chimeBtn');

  let tines = 5;
  let raking = false;
  let lastX = 0, lastY = 0;
  let stones = [
    { x: 260, y: 210, rx: 46, ry: 34, rot: -0.2 },
    { x: 640, y: 310, rx: 58, ry: 42, rot: 0.3 }
  ];
  let audioCtx = null, chimeOn = false;

  function playChime() {
    if (!chimeOn || !audioCtx) return;
    const notes = [523.25, 587.33, 659.25, 783.99, 880.00];
    const f = notes[Math.floor(Math.random() * notes.length)];
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.05, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 1.2);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 1.25);
  }

  function initSand() {
    ctx.fillStyle = '#d9cfb8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Subtle grain
    for (let i = 0; i < 6500; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.16)' : 'rgba(110,95,72,0.12)';
      ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
    }
    drawStones();
  }

  function drawStones() {
    for (const s of stones) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);

      // Drop shadow
      ctx.fillStyle = 'rgba(40,32,22,0.28)';
      ctx.beginPath();
      ctx.ellipse(8, 10, s.rx, s.ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Stone body
      const grad = ctx.createRadialGradient(-s.rx * 0.25, -s.ry * 0.25, 4, 0, 0, s.rx);
      grad.addColorStop(0, '#7c8288');
      grad.addColorStop(1, '#3d4147');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Moss patch
      ctx.fillStyle = '#52796f';
      ctx.beginPath();
      ctx.ellipse(-s.rx * 0.28, s.ry * 0.15, s.rx * 0.42, s.ry * 0.34, 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  function rakeStroke(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    if (len < 1) return;
    const nx = -dy / len, ny = dx / len;
    const spacing = tines === 5 ? 11 : 6.5;
    const half = (tines - 1) / 2;

    for (let i = 0; i < tines; i++) {
      const off = (i - half) * spacing;
      const ox = nx * off, oy = ny * off;

      // Shadow groove
      ctx.strokeStyle = 'rgba(110, 96, 74, 0.52)';
      ctx.lineWidth = tines === 5 ? 4.2 : 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1 + ox + 1.5, y1 + oy + 1.5);
      ctx.lineTo(x2 + ox + 1.5, y2 + oy + 1.5);
      ctx.stroke();

      // Lit ridge
      ctx.strokeStyle = 'rgba(248, 242, 228, 0.58)';
      ctx.lineWidth = tines === 5 ? 2.6 : 1.6;
      ctx.beginPath();
      ctx.moveTo(x1 + ox - 1.2, y1 + oy - 1.2);
      ctx.lineTo(x2 + ox - 1.2, y2 + oy - 1.2);
      ctx.stroke();
    }
    drawStones();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const p = getPos(e);
    raking = true;
    lastX = p.x; lastY = p.y;
    if (Math.random() < 0.35) playChime();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!raking) return;
    const p = getPos(e);
    rakeStroke(lastX, lastY, p.x, p.y);
    lastX = p.x; lastY = p.y;
  });

  window.addEventListener('pointerup', () => { raking = false; });

  rakeWide.addEventListener('click', () => {
    tines = 5;
    rakeWide.classList.add('active');
    rakeFine.classList.remove('active');
  });

  rakeFine.addEventListener('click', () => {
    tines = 9;
    rakeFine.classList.add('active');
    rakeWide.classList.remove('active');
  });

  document.getElementById('stoneBtn').addEventListener('click', () => {
    stones.push({
      x: 100 + Math.random() * 730,
      y: 80 + Math.random() * 340,
      rx: 28 + Math.random() * 30,
      ry: 22 + Math.random() * 20,
      rot: Math.random() * Math.PI
    });
    drawStones();
    playChime();
  });

  document.getElementById('smoothBtn').addEventListener('click', () => {
    stones = stones.slice(0, 2);
    initSand();
  });

  chimeBtn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    chimeOn = !chimeOn;
    chimeBtn.textContent = chimeOn ? 'Chimes: On' : 'Chimes: Off';
    chimeBtn.classList.toggle('active', chimeOn);
    if (chimeOn) playChime();
  });

  initSand();
})();
</script>
</body>
</html>
