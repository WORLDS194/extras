<!-- 11-pixel-sprite-forge.html — Pixel Sprite & Favicon Forge: A 16x16 pixel art editor with mirror mode, flood fill, and instant PNG/SVG export. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Sprite & Favicon Forge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #101219;
    color: #eef2f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 960px;
    background: #171a24;
    border: 1px solid #2b3245;
    border-radius: 18px;
    padding: 20px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  }
  @media (max-width: 780px) { .app { grid-template-columns: 1fr; } }
  .sidebar { display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.12rem; }
  .sub { font-size: 0.76rem; color: #8c96ad; margin-top: 2px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    background: #222737;
    color: #eef2f8;
    border: 1px solid #353d54;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.active { background: #38e4ae; color: #071b14; border-color: #38e4ae; }
  .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.active { border-color: #fff; transform: scale(1.08); }
  .previews {
    background: #10131c;
    border: 1px solid #2a3042;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-around;
  }
  canvas#prev1, canvas#prev4 { image-rendering: pixelated; border: 1px solid #333b52; background: #0b0d13; }
  .canvas-area {
    background: #0d1017;
    border: 1px solid #2b3245;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#editor {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1;
    image-rendering: pixelated;
    cursor: crosshair;
    border: 2px solid #353d54;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div>
      <h1>Pixel Sprite Forge</h1>
      <p class="sub">16×16 sprite &amp; icon studio with mirror mode and offline PNG export</p>
    </div>

    <div class="tools">
      <button id="tPen" class="active">Pencil</button>
      <button id="tErase">Eraser</button>
      <button id="tFill">Bucket Fill</button>
      <button id="tMirror">Mirror X: Off</button>
    </div>

    <div class="palette" id="palette"></div>
    <div style="display:flex;align-items:center;gap:8px;font-size:0.78rem;color:#8c96ad;">
      <label for="pick">Custom:</label>
      <input id="pick" type="color" value="#38e4ae" style="width:42px;height:28px;border:none;background:none;cursor:pointer;">
    </div>

    <div class="previews">
      <div style="text-align:center;font-size:0.7rem;color:#8c96ad;">
        <canvas id="prev1" width="16" height="16" style="width:32px;height:32px;"></canvas>
        <div>2×</div>
      </div>
      <div style="text-align:center;font-size:0.7rem;color:#8c96ad;">
        <canvas id="prev4" width="16" height="16" style="width:64px;height:64px;"></canvas>
        <div>4×</div>
      </div>
    </div>

    <div class="tools">
      <button id="exportPng">Download PNG</button>
      <button id="clearBtn">Clear Grid</button>
    </div>
  </div>

  <div class="canvas-area">
    <canvas id="editor" width="480" height="480"></canvas>
  </div>
</div>

<script>
(() => {
  const N = 16;
  const grid = Array.from({ length: N }, () => Array(N).fill(null));
  const COLORS = [
    '#000000','#ffffff','#ff5e5b','#ffbe3b','#38e4ae','#3b82f6',
    '#a78bfa','#f472b6','#64748b','#1e293b','#991b1b','#065f46'
  ];

  let color = '#38e4ae';
  let tool = 'pen';
  let mirror = false;
  let drawing = false;

  const ed = document.getElementById('editor');
  const ctx = ed.getContext('2d');
  const p1 = document.getElementById('prev1').getContext('2d');
  const p4 = document.getElementById('prev4').getContext('2d');
  const palEl = document.getElementById('palette');
  const pick = document.getElementById('pick');

  function buildPalette() {
    palEl.innerHTML = '';
    COLORS.forEach(c => {
      const d = document.createElement('div');
      d.className = 'swatch' + (c === color ? ' active' : '');
      d.style.background = c;
      d.addEventListener('click', () => {
        color = c;
        pick.value = c;
        if (tool === 'erase') setTool('pen');
        buildPalette();
      });
      palEl.appendChild(d);
    });
  }

  pick.addEventListener('input', () => {
    color = pick.value;
    if (tool === 'erase') setTool('pen');
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  });

  function setTool(t) {
    tool = t;
    ['tPen','tErase','tFill'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(t === 'pen' ? 'tPen' : t === 'erase' ? 'tErase' : 'tFill').classList.add('active');
  }

  document.getElementById('tPen').addEventListener('click', () => setTool('pen'));
  document.getElementById('tErase').addEventListener('click', () => setTool('erase'));
  document.getElementById('tFill').addEventListener('click', () => setTool('fill'));
  document.getElementById('tMirror').addEventListener('click', (e) => {
    mirror = !mirror;
    e.target.textContent = mirror ? 'Mirror X: On' : 'Mirror X: Off';
    e.target.classList.toggle('active', mirror);
  });

  function flood(x, y, target, rep) {
    if (target === rep) return;
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cy < 0 || cx >= N || cy >= N) continue;
      if (grid[cy][cx] !== target) continue;
      grid[cy][cx] = rep;
      stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
    }
  }

  function paintAt(gx, gy) {
    if (gx < 0 || gy < 0 || gx >= N || gy >= N) return;
    if (tool === 'fill') {
      flood(gx, gy, grid[gy][gx], color);
    } else {
      const val = tool === 'erase' ? null : color;
      grid[gy][gx] = val;
      if (mirror) grid[gy][N - 1 - gx] = val;
    }
    render();
  }

  function render() {
    const cell = ed.width / N;
    ctx.clearRect(0, 0, ed.width, ed.height);
    p1.clearRect(0, 0, N, N);
    p4.clearRect(0, 0, N, N);

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#141824' : '#191e2c';
        ctx.fillRect(x * cell, y * cell, cell, cell);
        if (grid[y][x]) {
          ctx.fillStyle = grid[y][x];
          ctx.fillRect(x * cell, y * cell, cell, cell);
          p1.fillStyle = grid[y][x];
          p1.fillRect(x, y, 1, 1);
          p4.fillStyle = grid[y][x];
          p4.fillRect(x, y, 1, 1);
        }
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, ed.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(ed.width, i * cell); ctx.stroke();
    }
  }

  function getCell(e) {
    const rect = ed.getBoundingClientRect();
    const x = Math.floor(((e.clientX - rect.left) / rect.width) * N);
    const y = Math.floor(((e.clientY - rect.top) / rect.height) * N);
    return [x, y];
  }

  ed.addEventListener('pointerdown', (e) => {
    drawing = true;
    const [x, y] = getCell(e);
    paintAt(x, y);
  });
  ed.addEventListener('pointermove', (e) => {
    if (!drawing || tool === 'fill') return;
    const [x, y] = getCell(e);
    paintAt(x, y);
  });
  window.addEventListener('pointerup', () => { drawing = false; });

  document.getElementById('clearBtn').addEventListener('click', () => {
    for (let y = 0; y < N; y++) grid[y].fill(null);
    render();
  });

  document.getElementById('exportPng').addEventListener('click', () => {
    const url = document.getElementById('prev4').toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sprite-16x16.png';
    a.click();
  });

  // Starter heart icon
  const heart = [
    [4,4],[5,4],[10,4],[11,4],[3,5],[6,5],[9,5],[12,5],
    [2,6],[7,6],[8,6],[13,6],[2,7],[13,7],[3,8],[12,8],
    [4,9],[11,9],[5,10],[10,10],[6,11],[9,11],[7,12],[8,12]
  ];
  heart.forEach(([x,y]) => { grid[y][x] = '#ff5e5b'; });

  buildPalette();
  render();
})();
</script>
</body>
</html>
