<!-- 14-gravity-orbit-sim.html — Pocket Solar System & Gravity Slingshot: Fling planets around stars, toggle binary suns, and watch orbital trails. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Solar System & Gravity Slingshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060810;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
  }
  .bar {
    width: 100%;
    max-width: 1000px;
    background: #101422;
    border: 1px solid #242c44;
    border-radius: 14px;
    padding: 12px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .bar h1 { font-size: 1.12rem; color: #fbbf24; }
  .bar p { font-size: 0.78rem; color: #8c99b5; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    background: #1a2136;
    color: #e2e8f0;
    border: 1px solid #2e3959;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.on { background: #fbbf24; color: #1c1202; border-color: #fbbf24; }
  canvas#space {
    width: 100%;
    max-width: 1000px;
    height: 540px;
    background: #04060c;
    border: 2px solid #222a40;
    border-radius: 16px;
    cursor: crosshair;
    box-shadow: 0 24px 60px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<div class="bar">
  <div>
    <h1>Pocket Solar System &amp; Gravity Slingshot</h1>
    <p>Click and drag anywhere in space to slingshot a new planet into orbit around the star</p>
  </div>
  <div class="btns">
    <button id="binaryBtn">Binary Stars: Off</button>
    <button id="trailsBtn" class="on">Trails: On</button>
    <button id="soundBtn">Chimes: Off</button>
    <button id="resetBtn">Reset System</button>
  </div>
</div>
<canvas id="space" width="1000" height="540"></canvas>

<script>
(() => {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  const binaryBtn = document.getElementById('binaryBtn');
  const trailsBtn = document.getElementById('trailsBtn');
  const soundBtn = document.getElementById('soundBtn');

  let binary = false, trails = true, soundOn = false, audioCtx = null;
  let stars = [], bodies = [];
  let dragStart = null, dragCur = null;

  const BG_STARS = Array.from({ length: 140 }, () => ({
    x: Math.random() * 1000, y: Math.random() * 540, r: Math.random() * 1.4 + 0.3, a: Math.random() * 0.6 + 0.2
  }));

  const PLANET_COLS = ['#38e4ae','#60a5fa','#f472b6','#a78bfa','#fb923c'];

  function playNote(freq) {
    if (!soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.05, now);
    g.gain.exponentialRampToValueAtTime(0.0005, now + 0.4);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.42);
  }

  function resetSystem() {
    stars = binary
      ? [{ x: 430, y: 270, m: 4200, r: 22, c: '#fbbf24' }, { x: 570, y: 270, m: 4200, r: 20, c: '#fb923c' }]
      : [{ x: 500, y: 270, m: 6800, r: 26, c: '#fbbf24' }];

    bodies = [
      { x: 500, y: 145, vx: 6.9, vy: 0, r: 6, c: '#38e4ae', trail: [] },
      { x: 500, y: 80, vx: 5.8, vy: 0, r: 8, c: '#60a5fa', trail: [] },
      { x: 240, y: 270, vx: 0, vy: -5.0, r: 7, c: '#f472b6', trail: [] }
    ];
  }

  function step() {
    requestAnimationFrame(step);
    ctx.fillStyle = '#04060c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Background stars
    BG_STARS.forEach(s => {
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });

    // Stars
    for (const st of stars) {
      const g = ctx.createRadialGradient(st.x, st.y, 2, st.x, st.y, st.r * 2.4);
      g.addColorStop(0, '#fff7ed');
      g.addColorStop(0.4, st.c);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r * 2.4, 0, Math.PI * 2); ctx.fill();
    }

    // Update & draw planets
    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      let ax = 0, ay = 0, crashed = false;
      for (const st of stars) {
        const dx = st.x - b.x, dy = st.y - b.y;
        const d2 = dx * dx + dy * dy;
        const d = Math.sqrt(d2);
        if (d < st.r + b.r) { crashed = true; break; }
        const f = st.m / Math.max(400, d2);
        ax += (dx / d) * f;
        ay += (dy / d) * f;
      }
      if (crashed) {
        bodies.splice(i, 1);
        playNote(180);
        continue;
      }

      b.vx += ax * 0.16;
      b.vy += ay * 0.16;
      b.x += b.vx;
      b.y += b.vy;

      b.trail.push([b.x, b.y]);
      if (b.trail.length > 75) b.trail.shift();

      if (trails && b.trail.length > 1) {
        ctx.strokeStyle = b.c + '66';
        ctx.lineWidth = 2;
        ctx.beginPath();
        b.trail.forEach(([tx, ty], idx) => idx === 0 ? ctx.moveTo(tx, ty) : ctx.lineTo(tx, ty));
        ctx.stroke();
      }

      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }

    // Slingshot aim line
    if (dragStart && dragCur) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(dragStart.x, dragStart.y);
      ctx.lineTo(dragCur.x, dragCur.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(dragStart.x, dragStart.y, 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragStart = getPos(e);
    dragCur = dragStart;
  });
  window.addEventListener('pointermove', (e) => {
    if (dragStart) dragCur = getPos(e);
  });
  window.addEventListener('pointerup', () => {
    if (!dragStart || !dragCur) return;
    const vx = (dragStart.x - dragCur.x) * 0.06;
    const vy = (dragStart.y - dragCur.y) * 0.06;
    bodies.push({
      x: dragStart.x, y: dragStart.y,
      vx: Math.abs(vx) < 0.2 && Math.abs(vy) < 0.2 ? 4.8 : vx,
      vy,
      r: 5 + Math.random() * 4,
      c: PLANET_COLS[Math.floor(Math.random() * PLANET_COLS.length)],
      trail: []
    });
    playNote(440 + Math.random() * 320);
    dragStart = null; dragCur = null;
  });

  binaryBtn.addEventListener('click', () => {
    binary = !binary;
    binaryBtn.textContent = binary ? 'Binary Stars: On' : 'Binary Stars: Off';
    binaryBtn.classList.toggle('on', binary);
    resetSystem();
  });
  trailsBtn.addEventListener('click', () => {
    trails = !trails;
    trailsBtn.textContent = trails ? 'Trails: On' : 'Trails: Off';
    trailsBtn.classList.toggle('on', trails);
  });
  soundBtn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'Chimes: On' : 'Chimes: Off';
    soundBtn.classList.toggle('on', soundOn);
  });
  document.getElementById('resetBtn').addEventListener('click', resetSystem);

  resetSystem();
  step();
})();
</script>
</body>
</html>
