<!-- 19-domino-cascade.html — Domino Topple Studio: Draw winding domino trails on a tabletop, topple them in a chain reaction, and hear wooden clacks. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domino Topple Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #14110f;
    color: #f3ede4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
  }
  .bar {
    width: 100%;
    max-width: 980px;
    background: #1e1915;
    border: 1px solid #3a3027;
    border-radius: 14px;
    padding: 12px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .bar h1 { font-size: 1.15rem; color: #f59e0b; }
  .bar p { font-size: 0.78rem; color: #a89989; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    background: #2b231d;
    color: #f3ede4;
    border: 1px solid #45392e;
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: #f59e0b; color: #1f1302; border-color: #f59e0b; }
  canvas#table {
    width: 100%;
    max-width: 980px;
    height: 520px;
    background: #1a1512;
    border: 2px solid #3a3027;
    border-radius: 16px;
    cursor: crosshair;
    box-shadow: 0 24px 60px rgba(0,0,0,0.65);
  }
</style>
</head>
<body>
<div class="bar">
  <div>
    <h1>Domino Topple Studio</h1>
    <p>Drag across the table to place a domino chain, or use the Spiral preset, then hit Topple!</p>
  </div>
  <div class="btns">
    <button id="toppleBtn" class="primary">Topple!</button>
    <button id="spiralBtn">Spiral Preset</button>
    <button id="soundBtn">Clack Audio: Off</button>
    <button id="clearBtn">Clear</button>
  </div>
</div>
<canvas id="table" width="980" height="520"></canvas>

<script>
(() => {
  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');
  const soundBtn = document.getElementById('soundBtn');

  let dominos = [];
  let drawing = false, lastPt = null;
  let audioCtx = null, soundOn = false;

  const COLS = ['#f8fafc','#fbbf24','#38e4ae','#f472b6','#60a5fa'];

  function playClack() {
    if (!soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(750 + Math.random() * 250, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.035);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.045);
  }

  function makeSpiral() {
    dominos = [];
    for (let i = 0; i < 64; i++) {
      const t = i * 0.24;
      const r = 210 - i * 2.4;
      const x = 490 + Math.cos(t) * r;
      const y = 260 + Math.sin(t) * r;
      dominos.push({
        x, y,
        ang: t + Math.PI / 2,
        tilt: 0,
        falling: false,
        fallen: false,
        col: COLS[i % COLS.length]
      });
    }
  }

  function step() {
    requestAnimationFrame(step);
    ctx.fillStyle = '#1a1512';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle wood grain lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let y = 20; y < canvas.height; y += 26) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    for (let i = 0; i < dominos.length; i++) {
      const d = dominos[i];
      if (d.falling && d.tilt < 1) {
        d.tilt = Math.min(1, d.tilt + 0.14);
        if (d.tilt >= 0.45 && !d.triggeredNext) {
          d.triggeredNext = true;
          // Trigger nearest unfallen domino in front
          for (let j = i + 1; j < dominos.length; j++) {
            const nxt = dominos[j];
            if (!nxt.falling && Math.hypot(nxt.x - d.x, nxt.y - d.y) < 36) {
              nxt.falling = true;
              playClack();
              break;
            }
          }
        }
      }

      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.ang);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-4 + d.tilt * 10, -12 + d.tilt * 4, 8 + d.tilt * 14, 24);

      // Domino tile
      const w = 7 + d.tilt * 16;
      ctx.fillStyle = d.col;
      ctx.fillRect(-3, -12, w, 24);
      ctx.strokeStyle = '#0f0d0b';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-3, -12, w, 24);

      ctx.restore();
    }
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
  }

  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    lastPt = getPos(e);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = getPos(e);
    if (Math.hypot(p.x - lastPt.x, p.y - lastPt.y) >= 22) {
      const ang = Math.atan2(p.y - lastPt.y, p.x - lastPt.x);
      dominos.push({
        x: p.x, y: p.y, ang,
        tilt: 0, falling: false, triggeredNext: false,
        col: COLS[dominos.length % COLS.length]
      });
      lastPt = p;
    }
  });

  window.addEventListener('pointerup', () => { drawing = false; });

  document.getElementById('toppleBtn').addEventListener('click', () => {
    if (dominos.length) {
      dominos[0].falling = true;
      playClack();
    }
  });
  document.getElementById('spiralBtn').addEventListener('click', makeSpiral);
  document.getElementById('clearBtn').addEventListener('click', () => { dominos = []; });
  soundBtn.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'Clack Audio: On' : 'Clack Audio: Off';
    soundBtn.classList.toggle('primary', soundOn);
  });

  makeSpiral();
  step();
})();
</script>
</body>
</html>
