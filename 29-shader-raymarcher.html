<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shader raymarcher</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;color:#e2e8f0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
  .top{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h1{font-size:15px;color:#38bdf8}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{background:#111827;color:#e2e8f0;border:1px solid #283548;padding:6px 10px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
  button.active{border-color:#38bdf8;background:#0c2238}
  canvas{width:min(720px,95vw);height:min(460px,62vw);border-radius:10px;border:1px solid #1e293b;display:block}
  .sliders{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;font-size:12px;color:#94a3b8}
  label{display:flex;flex-direction:column;gap:4px;background:#0f172a;padding:8px 10px;border-radius:6px;border:1px solid #1e293b}
  input{accent-color:#38bdf8}
</style>
</head>
<body>
<div class="top">
  <h1>webgl2 sdf raymarcher</h1>
  <div class="btns" id="scenes">
    <button class="active" data-s="0">torus twist</button>
    <button data-s="1">metaballs</button>
    <button data-s="2">infinite grid</button>
  </div>
</div>
<canvas id="gl" width="720" height="460"></canvas>
<div class="sliders">
  <label>twist <input id="twist" type="range" min="0" max="4" step="0.05" value="1.4"></label>
  <label>speed <input id="speed" type="range" min="0" max="2.5" step="0.05" value="1.0"></label>
  <label>glow <input id="glow" type="range" min="0.2" max="2.5" step="0.05" value="1.1"></label>
</div>
<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2');
if(!gl){ alert('webgl2 not supported'); }

const vs = `#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p,0.0,1.0); }`;

const fs = `#version 300 es
precision highp float;
uniform vec2 res;
uniform float time, twist, glow;
uniform int scene;
out vec4 fragColor;

mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

float map(vec3 p){
  if(scene==0){
    p.xz *= rot(time*0.5);
    p.xy *= rot(p.z*twist*0.35);
    vec2 q = vec2(length(p.xz)-1.1, p.y);
    return length(q)-0.36;
  } else if(scene==1){
    float d = length(p - vec3(sin(time)*0.9, cos(time*1.3)*0.5, 0.0)) - 0.65;
    d = smin(d, length(p - vec3(-sin(time*0.8)*0.9, sin(time)*0.4, 0.2)) - 0.55, 0.6);
    d = smin(d, length(p - vec3(0.0, cos(time)*0.7, sin(time*1.1)*0.6)) - 0.5, 0.6);
    return d;
  } else {
    p.z += time*2.0;
    p.xy *= rot(sin(time*0.3)*0.3);
    vec3 q = mod(p + 1.5, 3.0) - 1.5;
    return length(max(abs(q)-0.45,0.0))-0.06;
  }
}

vec3 norm(vec3 p){
  vec2 e = vec2(0.002,0.0);
  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx)));
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*res)/res.y;
  vec3 ro = vec3(0.0, 0.0, -3.4);
  vec3 rd = normalize(vec3(uv, 1.3));
  float t = 0.0, acc = 0.0;
  for(int i=0;i<72;i++){
    vec3 p = ro + rd*t;
    float d = map(p);
    acc += 0.02 / (0.04 + abs(d));
    if(d < 0.002 || t > 24.0) break;
    t += d;
  }
  vec3 col = vec3(0.03,0.04,0.08);
  if(t < 24.0){
    vec3 p = ro + rd*t;
    vec3 n = norm(p);
    float diff = max(dot(n, normalize(vec3(0.7,0.9,-0.6))), 0.0);
    vec3 base = 0.5 + 0.5*cos(time*0.6 + n.xyx + vec3(0.0,2.0,4.0));
    col = base * (diff*0.85 + 0.2);
  }
  col += vec3(0.15, 0.55, 0.95) * acc * 0.015 * glow;
  fragColor = vec4(pow(col, vec3(0.85)), 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

let scene = 0, tAcc = 0, last = performance.now();
document.querySelectorAll('#scenes button').forEach(b => {
  b.onclick = () => {
    scene = +b.dataset.s;
    document.querySelectorAll('#scenes button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
});

function frame(now){
  const dt = (now - last) * 0.001; last = now;
  tAcc += dt * (+document.getElementById('speed').value);
  gl.uniform2f(gl.getUniformLocation(prog,'res'), canvas.width, canvas.height);
  gl.uniform1f(gl.getUniformLocation(prog,'time'), tAcc);
  gl.uniform1f(gl.getUniformLocation(prog,'twist'), +document.getElementById('twist').value);
  gl.uniform1f(gl.getUniformLocation(prog,'glow'), +document.getElementById('glow').value);
  gl.uniform1i(gl.getUniformLocation(prog,'scene'), scene);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
