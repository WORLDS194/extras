<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#12101a;color:#eee6ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:20px;display:flex;justify-content:center}
  .app{width:100%;max-width:820px;display:flex;flex-direction:column;gap:14px}
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
  h1{font-size:16px;color:#f472b6}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{background:#1e192b;color:#eee6ff;border:1px solid #382e52;padding:6px 11px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
  button.play{background:#f472b6;color:#12101a;border-color:#f472b6;font-weight:600}
  .grid{display:flex;flex-direction:column;gap:8px}
  .track{display:grid;grid-template-columns:90px repeat(16,1fr);gap:4px;align-items:center}
  .label{font-size:11px;color:#a78bfa}
  .cell{aspect-ratio:1/1.2;background:#1a1625;border:1px solid #2d2542;border-radius:4px;cursor:pointer;transition:.08s}
  .cell.on{background:#a78bfa;border-color:#ddd6fe}
  .track[data-t="1"] .cell.on{background:#38bdf8;border-color:#bae6fd}
  .track[data-t="2"] .cell.on{background:#34d399;border-color:#a7f3d0}
  .track[data-t="3"] .cell.on{background:#fb923c;border-color:#fed7aa}
  .cell.now{outline:2px solid #f472b6;outline-offset:-2px}
  label{font-size:12px;color:#c4b5fd;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>8-bit chiptune tracker</h1>
    <div class="controls">
      <button class="play" id="playBtn">play</button>
      <label>bpm <input id="bpm" type="range" min="70" max="180" value="125"> <span id="bpmVal">125</span></label>
      <button id="presetBtn">load groove</button>
      <button id="clearBtn">clear</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const STEPS = 16;
const TRACKS = [
  {name:'lead (sq)', type:'square', notes:[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33]},
  {name:'arp (tri)', type:'triangle', notes:[261.63,329.63,392,329.63,293.66,349.23,440,349.23,261.63,329.63,392,523.25,440,392,329.63,293.66]},
  {name:'bass (saw)', type:'sawtooth', notes:[130.81,130.81,164.81,130.81,146.83,146.83,174.61,146.83,130.81,130.81,196,130.81,174.61,164.81,146.83,123.47]},
  {name:'hat (noise)', type:'noise', notes:[]}
];
const pattern = TRACKS.map(() => Array(STEPS).fill(false));
let ac = null, timer = null, step = 0, playing = false;

const gridEl = document.getElementById('grid');
TRACKS.forEach((tr, ti) => {
  const row = document.createElement('div');
  row.className = 'track'; row.dataset.t = ti;
  const lbl = document.createElement('div');
  lbl.className = 'label'; lbl.textContent = tr.name;
  row.appendChild(lbl);
  for(let s=0;s<STEPS;s++){
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.s = s;
    c.onclick = () => { pattern[ti][s] = !pattern[ti][s]; c.classList.toggle('on', pattern[ti][s]); };
    row.appendChild(c);
  }
  gridEl.appendChild(row);
});

function syncUI(){
  document.querySelectorAll('.track').forEach((row, ti) => {
    row.querySelectorAll('.cell').forEach((c, s) => {
      c.classList.toggle('on', pattern[ti][s]);
      c.classList.toggle('now', playing && s === step);
    });
  });
}

function loadGroove(){
  [0,2,4,7,8,10,12,14].forEach(s => pattern[0][s]=true);
  [1,3,5,7,9,11,13,15].forEach(s => pattern[1][s]=true);
  [0,4,8,12].forEach(s => pattern[2][s]=true);
  [2,6,10,14].forEach(s => pattern[3][s]=true);
  syncUI();
}
loadGroove();

function hit(ti, s){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  const t = ac.currentTime;
  const g = ac.createGain();
  g.connect(ac.destination);
  if(TRACKS[ti].type === 'noise'){
    const buf = ac.createBuffer(1, ac.sampleRate*0.05, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    src.connect(g); src.start(t);
  } else {
    const o = ac.createOscillator();
    o.type = TRACKS[ti].type;
    o.frequency.setValueAtTime(TRACKS[ti].notes[s], t);
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.14);
    o.connect(g); o.start(t); o.stop(t+0.15);
  }
}

function tick(){
  for(let ti=0;ti<TRACKS.length;ti++) if(pattern[ti][step]) hit(ti, step);
  syncUI();
  step = (step + 1) % STEPS;
}

const bpmIn = document.getElementById('bpm');
function start(){
  if(timer) clearInterval(timer);
  const ms = (60 / (+bpmIn.value) / 4) * 1000;
  timer = setInterval(tick, ms);
}
bpmIn.oninput = () => {
  document.getElementById('bpmVal').textContent = bpmIn.value;
  if(playing) start();
};

document.getElementById('playBtn').onclick = e => {
  playing = !playing;
  e.target.textContent = playing ? 'stop' : 'play';
  if(playing){ step=0; tick(); start(); }
  else { clearInterval(timer); syncUI(); }
};
document.getElementById('presetBtn').onclick = () => { pattern.forEach(r=>r.fill(false)); loadGroove(); };
document.getElementById('clearBtn').onclick = () => { pattern.forEach(r=>r.fill(false)); syncUI(); };
</script>
</body>
</html>
