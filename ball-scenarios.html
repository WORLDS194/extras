<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ball scenarios</title>
<style>
  :root {
    --bg: #04050b;
    --glass: rgba(14, 16, 28, 0.78);
    --border: rgba(255, 255, 255, 0.1);
    --text: #f1f4ff;
    --muted: #8a92b2;
    --accent: #6cf0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  /* floating top switcher bar */
  .topbar {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 10;
    pointer-events: none;
  }

  .pill-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 999px;
    pointer-events: auto;
    overflow-x: auto;
    max-width: 72vw;
    scrollbar-width: none;
  }
  .pill-bar::-webkit-scrollbar { display: none; }

  .sc-pill {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .sc-pill:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
  }

  .sc-pill.active {
    background: #ffffff;
    color: #06070f;
  }

  .action-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 999px;
    pointer-events: auto;
  }

  .act-btn, .act-select {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    outline: none;
  }

  .act-btn:hover, .act-select:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  .act-btn.primary {
    background: var(--accent);
    color: #04050b;
    border-color: transparent;
  }

  /* settings popover */
  .settings-pop {
    position: fixed;
    top: 62px;
    right: 12px;
    width: 240px;
    background: rgba(14, 16, 28, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
  }

  .settings-pop.open { display: flex; }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-head {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .slider-head strong { color: var(--text); }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* bottom mini stats */
  .bottom-hud {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--glass);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
    z-index: 10;
  }

  .bottom-hud strong {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="topbar">
  <div class="pill-bar" id="pillBar"></div>
  <div class="action-bar">
    <button class="act-btn primary" id="playBtn">pause</button>
    <button class="act-btn" id="resetBtn">reset</button>
    <select class="act-select" id="songSelect" title="bounce melody">
      <option value="mii">song: mii channel</option>
      <option value="tetris">song: tetris</option>
      <option value="rushe">song: rush e</option>
      <option value="pentatonic">song: chill</option>
    </select>
    <button class="act-btn" id="soundBtn">sound: on</button>
    <button class="act-btn" id="gearBtn">tune</button>
  </div>
</div>

<div class="settings-pop" id="settingsPop">
  <div class="slider-row">
    <div class="slider-head"><span>gravity</span><strong id="gravLbl">0.24</strong></div>
    <input type="range" id="gravSlider" min="0" max="0.6" step="0.02" value="0.24">
  </div>
  <div class="slider-row">
    <div class="slider-head"><span>speed boost / hit</span><strong id="boostLbl">1.05x</strong></div>
    <input type="range" id="boostSlider" min="1.00" max="1.15" step="0.01" value="1.05">
  </div>
  <div class="slider-row">
    <div class="slider-head"><span>time scale</span><strong id="timeLbl">1.00x</strong></div>
    <input type="range" id="timeSlider" min="0.3" max="2.5" step="0.05" value="1.0">
  </div>
</div>

<div class="bottom-hud">
  <span>bounces: <strong id="hudBounces">0</strong></span>
  <span>bps: <strong id="hudBps">0</strong></span>
  <span>speed: <strong id="hudSpeed">0</strong></span>
  <span id="hudExtraWrap"><span id="hudExtraLbl">sides</span>: <strong id="hudExtra">3</strong></span>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const pillBar = document.getElementById('pillBar');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const songSelect = document.getElementById('songSelect');
  const soundBtn = document.getElementById('soundBtn');
  const gearBtn = document.getElementById('gearBtn');
  const settingsPop = document.getElementById('settingsPop');

  const gravSlider = document.getElementById('gravSlider');
  const boostSlider = document.getElementById('boostSlider');
  const timeSlider = document.getElementById('timeSlider');
  const gravLbl = document.getElementById('gravLbl');
  const boostLbl = document.getElementById('boostLbl');
  const timeLbl = document.getElementById('timeLbl');

  const hudBounces = document.getElementById('hudBounces');
  const hudBps = document.getElementById('hudBps');
  const hudSpeed = document.getElementById('hudSpeed');
  const hudExtraLbl = document.getElementById('hudExtraLbl');
  const hudExtra = document.getElementById('hudExtra');

  // --- audio & real melodies ---
  let audioCtx = null;
  let soundOn = true;
  let lastNoteMs = 0;
  let noteIdx = 0;

  // midi note -> freq
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const SONGS = {
    mii: [
      66, 69, 73, 69, 66, 62, 62, 62,
      61, 62, 66, 69, 73, 69, 66, 76,
      75, 74, 73, 69, 66, 69, 73, 69,
      66, 62, 62, 62, 61, 62, 66, 69
    ],
    tetris: [
      76, 71, 72, 74, 72, 71, 69, 69,
      72, 76, 74, 72, 71, 71, 72, 74,
      76, 72, 69, 69, 74, 77, 81, 79,
      77, 76, 72, 76, 74, 72, 71, 71
    ],
    rushe: [
      64, 64, 64, 64, 64, 64, 64, 64,
      65, 64, 63, 64, 67, 64, 62, 64,
      69, 69, 69, 69, 71, 69, 68, 69,
      72, 71, 69, 67, 65, 64, 62, 60
    ],
    pentatonic: [
      60, 62, 64, 67, 69, 72, 74, 76,
      79, 81, 84, 81, 79, 76, 74, 72
    ]
  };

  function ensureAudio() {
    if (!soundOn) return;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playBounceNote(pitchShift = 0, dur = 0.16, vol = 0.11) {
    if (!soundOn || !audioCtx) return;
    const now = performance.now();
    if (now - lastNoteMs < 22) return;
    lastNoteMs = now;

    const seq = SONGS[songSelect.value] || SONGS.mii;
    const midi = seq[noteIdx % seq.length] + pitchShift;
    noteIdx = (noteIdx + 1) % seq.length;

    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(mtof(midi), t);

    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function playBurst(freq = 170) {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.22);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.23);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.24);
  }

  // --- canvas sizing ---
  let W = 800, H = 600, CX = 400, CY = 320, R = 200;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H / 2 + 24;
    R = Math.min(W * 0.42, H * 0.34);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- global sim state ---
  let paused = false;
  let gravity = 0.24;
  let speedBoost = 1.05;
  let timeScale = 1.0;

  let bounces = 0;
  let bounceTimes = [];
  let particles = [];
  let hue = 185;
  let flash = 0;

  function hitBounce() {
    bounces++;
    bounceTimes.push(performance.now());
  }

  function getBps() {
    const now = performance.now();
    while (bounceTimes.length && now - bounceTimes[0] > 1000) bounceTimes.shift();
    return bounceTimes.length;
  }

  function addParticles(x, y, color, count = 12, spd = 1) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (1.5 + Math.random() * 4.5) * spd;
      particles.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 1,
        decay: 0.02 + Math.random() * 0.025,
        size: 1.8 + Math.random() * 2.5,
        color
      });
    }
  }

  function normAng(a) {
    const t = Math.PI * 2;
    return ((a % t) + t) % t;
  }

  function inGap(ang, gStart, gSize) {
    const a = normAng(ang);
    const s = normAng(gStart);
    const e = normAng(s + gSize);
    return s < e ? (a >= s && a <= e) : (a >= s || a <= e);
  }

  function clampSpd(b, max = 24) {
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > max) {
      b.vx = (b.vx / sp) * max;
      b.vy = (b.vy / sp) * max;
    }
  }

  function pushTrail(b, maxLen = 28) {
    if (!b.trail) b.trail = [];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > maxLen) b.trail.shift();
  }

  function drawBall(b, textAbove = '', camY = 0) {
    if (b.trail && b.trail.length > 1) {
      for (let i = 1; i < b.trail.length; i++) {
        const p0 = b.trail[i - 1];
        const p1 = b.trail[i];
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = (i / b.trail.length) * 0.55;
        ctx.lineWidth = Math.max(1.5, b.r * (i / b.trail.length) * 1.4);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y - camY);
        ctx.lineTo(p1.x, p1.y - camY);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y - camY, b.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.28, b.y - camY - b.r * 0.28, b.r * 0.26, 0, Math.PI * 2);
    ctx.fill();

    if (textAbove) {
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 13px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(textAbove, b.x, b.y - camY - b.r - 10);
    }
    ctx.restore();
  }

  function drawHookTitle(line1, line2 = '') {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 clamp(18px, 2.5vw, 26px) Inter, sans-serif';
    ctx.fillText(line1, CX, 92);
    if (line2) {
      ctx.fillStyle = 'rgba(255,255,255,0.58)';
      ctx.font = '600 13px Inter, sans-serif';
      ctx.fillText(line2, CX, 114);
    }
    ctx.restore();
  }

  // =========================================================
  // SCENARIOS (modeled directly on the viral Shorts format)
  // =========================================================
  const scenarios = [
    // 1. POLYGON EVOLVER (user's core prompt)
    {
      name: 'polygon evolver',
      extraLbl: 'sides',
      init() {
        this.sides = 3;
        this.rot = Math.PI / 6; // flat bottom triangle
        this.pulse = 0;
        this.ball = {
          x: CX,
          y: CY,
          vx: 3.4,
          vy: -4.2,
          r: 12,
          color: '#6cf0ff',
          trail: []
        };
      },
      onClick(mx, my) {
        const dx = mx - this.ball.x, dy = my - this.ball.y;
        const d = Math.hypot(dx, dy) || 1;
        this.ball.vx += (dx / d) * 4;
        this.ball.vy += (dy / d) * 4;
      },
      step(dt) {
        const b = this.ball;
        const steps = Math.max(5, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 2.5));
        const sub = dt / steps;

        for (let s = 0; s < steps; s++) {
          b.vy += gravity * sub;
          b.x += b.vx * sub;
          b.y += b.vy * sub;

          const n = this.sides;
          const verts = [];
          for (let i = 0; i < n; i++) {
            const a = this.rot + (i * Math.PI * 2) / n;
            verts.push({ x: CX + Math.cos(a) * R, y: CY + Math.sin(a) * R });
          }

          let bounced = false;
          for (let i = 0; i < n; i++) {
            const A = verts[i], B = verts[(i + 1) % n];
            const ex = B.x - A.x, ey = B.y - A.y;
            const lenSq = ex * ex + ey * ey;
            const t = Math.max(0, Math.min(1, ((b.x - A.x) * ex + (b.y - A.y) * ey) / lenSq));
            const px = A.x + t * ex, py = A.y + t * ey;

            let nx = -ey, ny = ex;
            const nl = Math.hypot(nx, ny) || 1;
            nx /= nl; ny /= nl;
            if ((CX - px) * nx + (CY - py) * ny < 0) { nx = -nx; ny = -ny; }

            const dEdge = (b.x - px) * nx + (b.y - py) * ny;
            if (dEdge < b.r) {
              b.x += nx * (b.r - dEdge);
              b.y += ny * (b.r - dEdge);
              const vn = b.vx * nx + b.vy * ny;
              if (vn < 0) {
                b.vx -= 2 * vn * nx;
                b.vy -= 2 * vn * ny;
                // tiny nudge only if almost zero horizontal speed
                if (Math.abs(b.vx) < 0.8) b.vx += (Math.random() - 0.5) * 2;
                b.vx *= speedBoost;
                b.vy *= speedBoost;
                clampSpd(b, 25);

                if (!bounced) {
                  bounced = true;
                  this.sides = Math.min(80, this.sides + 1);
                  this.pulse = 1;
                  hue = (hue + 14) % 360;
                  b.color = `hsl(${hue}, 95%, 64%)`;
                  hitBounce();
                  playBounceNote();
                  addParticles(px, py, b.color, 10);
                }
              }
            }
          }
        }
        this.pulse *= 0.86;
        pushTrail(b);
      },
      draw() {
        drawHookTitle('each bounce adds +1 side & speed', 'starts at a triangle in the center');
        const col = `hsl(${hue}, 92%, 62%)`;
        const drawR = R + this.pulse * 7;

        ctx.save();
        ctx.strokeStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = 18 + this.pulse * 12;
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        for (let i = 0; i < this.sides; i++) {
          const a = this.rot + (i * Math.PI * 2) / this.sides;
          const x = CX + Math.cos(a) * drawR;
          const y = CY + Math.sin(a) * drawR;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.font = '800 76px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.sides >= 80 ? '∞' : String(this.sides), CX, CY);
        ctx.textBaseline = 'alphabetic';

        drawBall(this.ball);
      },
      getExtra() { return this.sides >= 80 ? 'circle' : this.sides; },
      getSpeed() { return Math.hypot(this.ball.vx, this.ball.vy).toFixed(1); }
    },

    // 2. EACH BALL HAS ONLY 4 SECONDS TO ESCAPE (Short #1: aLYWAlq9X_Y)
    {
      name: '4 seconds to escape',
      extraLbl: 'frozen',
      init() {
        this.gapStart = Math.PI - 0.32;
        this.gapSize = 0.64;
        this.frozen = [];
        this.escaped = false;
        this.spawnActive();
      },
      spawnActive() {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
        hue = (hue + 42) % 360;
        this.active = {
          x: CX,
          y: CY - 15,
          vx: Math.cos(a) * 5.2,
          vy: Math.sin(a) * 5.2,
          r: 10,
          color: `hsl(${hue}, 95%, 65%)`,
          age: 0,
          trail: []
        };
      },
      onClick() {
        this.spawnActive();
      },
      step(dt) {
        if (this.escaped) return;
        const dtSec = dt / 60;
        const b = this.active;
        b.age += dtSec;

        // 4 seconds expired -> freeze in place and spawn next ball!
        if (b.age >= 4.0) {
          this.frozen.push({ x: b.x, y: b.y, r: b.r, color: b.color });
          addParticles(b.x, b.y, b.color, 8, 0.7);
          playBurst(180);
          if (this.frozen.length >= 22) {
            // finale explosion
            for (const f of this.frozen) addParticles(f.x, f.y, f.color, 12, 1.4);
            flash = 0.45;
            this.init();
            return;
          }
          this.spawnActive();
          return;
        }

        const steps = Math.max(4, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 2.5));
        const sub = dt / steps;
        for (let s = 0; s < steps; s++) {
          b.vy += gravity * sub;
          b.x += b.vx * sub;
          b.y += b.vy * sub;

          // bounce off frozen balls
          for (const f of this.frozen) {
            const dx = b.x - f.x, dy = b.y - f.y;
            const d = Math.hypot(dx, dy);
            const minD = b.r + f.r;
            if (d > 0 && d < minD) {
              const nx = dx / d, ny = dy / d;
              b.x = f.x + nx * minD;
              b.y = f.y + ny * minD;
              const vn = b.vx * nx + b.vy * ny;
              if (vn < 0) {
                b.vx -= 2 * vn * nx;
                b.vy -= 2 * vn * ny;
                hitBounce();
                playBounceNote(4, 0.12, 0.08);
              }
            }
          }

          // ring collision with gap on the left
          const dx = b.x - CX, dy = b.y - CY;
          const dist = Math.hypot(dx, dy);
          if (dist + b.r >= R) {
            const ang = Math.atan2(dy, dx);
            if (inGap(ang, this.gapStart, this.gapSize)) {
              if (dist - b.r > R + 6) {
                // escaped!
                addParticles(b.x, b.y, '#ffffff', 36, 1.6);
                playBounceNote(12, 0.3, 0.14);
                flash = 0.35;
                this.init();
                return;
              }
            } else {
              const nx = -dx / (dist || 1), ny = -dy / (dist || 1);
              b.x = CX - nx * (R - b.r);
              b.y = CY - ny * (R - b.r);
              const vn = b.vx * nx + b.vy * ny;
              if (vn < 0) {
                b.vx -= 2 * vn * nx;
                b.vy -= 2 * vn * ny;
                b.vx *= 1.02;
                b.vy *= 1.02;
                clampSpd(b, 17);
                hue = (hue + 8) % 360;
                hitBounce();
                playBounceNote();
                addParticles(b.x - nx * b.r, b.y - ny * b.r, b.color, 5, 0.7);
              }
            }
          }
        }
        pushTrail(b, 20);
      },
      draw() {
        drawHookTitle('each ball has only 4 seconds to escape', 'timed-out balls freeze as obstacles');
        const ringCol = `hsl(${hue}, 92%, 60%)`;

        ctx.save();
        ctx.strokeStyle = ringCol;
        ctx.shadowColor = ringCol;
        ctx.shadowBlur = 16;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();

        const left = Math.max(0, 4.0 - this.active.age);

      },

    // 3. 500,000 CHUTE ESCAPE (Short #2: u5sQ42ibrBo)
    {
      name: '500k chute escape',
      extraLbl: 'left',
      init() {
        this.count = 500000;
        this.chamberR = R * 0.92;
        this.chuteHalf = 13;
        this.inChute = false;
        this.camY = 0;
        this.ball = {
          x: CX,
          y: CY - 20,
          vx: 5.5,
          vy: -3.2,
          r: 9,
          color: '#ff9038',
          trail: []
        };
      },
      onClick() {
        if (!this.inChute) this.chamberR = Math.max(this.chuteHalf + 6, this.chamberR - 25);
      },
      step(dt) {
        const b = this.ball;
        if (!this.inChute) {
          const steps = Math.max(5, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 2.5));
          const sub = dt / steps;
          for (let s = 0; s < steps; s++) {
            b.vy += Math.max(0.22, gravity) * sub;
            b.x += b.vx * sub;
            b.y += b.vy * sub;

            const dx = b.x - CX, dy = b.y - CY;
            const dist = Math.hypot(dx, dy);
            const overChute = Math.abs(dx) < this.chuteHalf - b.r + 1 && dy > 0;

            if (overChute && dist + b.r >= this.chamberR) {
              this.inChute = true;
              b.vx = (b.vx >= 0 ? 1 : -1) * 16;
              b.vy = 4;
              break;
            }

            if (dist + b.r >= this.chamberR && !overChute) {
              const nx = -dx / (dist || 1), ny = -dy / (dist || 1);
              b.x = CX - nx * (this.chamberR - b.r);
              b.y = CY - ny * (this.chamberR - b.r);
              const vn = b.vx * nx + b.vy * ny;
              if (vn < 0) {
                b.vx -= 2 * vn * nx;
                b.vy -= 2 * vn * ny;
                this.chamberR = Math.max(this.chuteHalf + b.r + 2, this.chamberR - 4.2);
                this.count = Math.max(0, this.count - 1);
                hue = (hue + 6) % 360;
                b.color = `hsl(${hue}, 95%, 62%)`;
                hitBounce();
                playBounceNote();
              }
            }
          }
        } else {
          // rapid chute descent! exact high-speed wall bouncing
          b.vy += 0.14 * dt;
          b.vy = Math.min(b.vy, 11);
          b.y += b.vy * dt;

          const chuteW = (this.chuteHalf - b.r) * 2;
          const travel = Math.abs(b.vx) * dt * 28; // insane horizontal bounces
          const wallHits = Math.max(1, Math.floor(travel / Math.max(1, chuteW)));
          const dropCount = Math.min(this.count, wallHits * 110);
          this.count -= dropCount;
          bounces += wallHits;
          for (let i = 0; i < Math.min(wallHits, 12); i++) bounceTimes.push(performance.now());

          // visual x oscillation inside chute
          b.x += b.vx * dt;
          if (b.x - b.r < CX - this.chuteHalf) {
            b.x = CX - this.chuteHalf + b.r;
            b.vx = Math.abs(b.vx);
          } else if (b.x + b.r > CX + this.chuteHalf) {
            b.x = CX + this.chuteHalf - b.r;
            b.vx = -Math.abs(b.vx);
          }

          hue = (hue + 4 * dt) % 360;
          b.color = `hsl(${hue}, 95%, 62%)`;
          playBounceNote(Math.floor((500000 - this.count) / 40000), 0.06, 0.06);

          // camera follows ball
          const targetCam = Math.max(0, b.y - CY);
          this.camY += (targetCam - this.camY) * 0.25;

          if (this.count <= 0) {
            addParticles(b.x, b.y - this.camY, '#ffffff', 60, 2.2);
            playBurst(220);
            flash = 0.55;
            this.init();
            return;
          }
        }
        pushTrail(b, 35);
      },
      draw() {
        // dense rainbow rings centered at (CX, CY - camY)
        const baseY = CY - this.camY;
        const maxRing = Math.max(W, H) * 1.4;
        const startR = Math.max(this.chamberR, this.chuteHalf + 2);

        ctx.lineWidth = 2.2;
        for (let r = startR; r < maxRing; r += 4.5) {
          const gAng = Math.asin(Math.min(0.99, this.chuteHalf / r));
          ctx.strokeStyle = `hsl(${(r * 1.6 + hue) % 360}, 92%, 56%)`;
          ctx.beginPath();
          ctx.arc(CX, baseY, r, Math.PI / 2 + gAng, Math.PI / 2 + Math.PI * 2 - gAng);
          ctx.stroke();
        }

        // black center chamber
        ctx.fillStyle = '#04050b';
        ctx.beginPath();
        ctx.arc(CX, baseY, startR, 0, Math.PI * 2);
        ctx.fill();

        // black chute cutout
        ctx.fillRect(CX - this.chuteHalf, baseY, this.chuteHalf * 2, H + this.camY);

        drawHookTitle('will the bouncing ball escape?', 'shrinking chamber -> 500,000-bounce chute');
        drawBall(this.ball, String(this.count), this.camY);
      },
      getExtra() { return this.count.toLocaleString(); },
      getSpeed() { return this.inChute ? 'hyper' : Math.hypot(this.ball.vx, this.ball.vy).toFixed(1); }
    },

    // 5. RING BREAKER (16 concentric rotating rings)
    {
      name: 'ring breaker',
      extraLbl: 'rings',
      init() {
        this.rings = [];
        const total = 16;
        for (let i = 0; i < total; i++) {
          this.rings.push({
            r: 52 + i * ((R * 1.15 - 52) / total),
            gapStart: (i * 0.85) % (Math.PI * 2),
            gapSize: 0.62,
            rot: (i % 2 === 0 ? 1 : -1) * (0.014 + i * 0.0012),
            hue: (i * 22) % 360,
            alive: true
          });

        this.ball = { x: CX, y: CY, vx: 3.8, vy: -4.4, r: 9, color: '#ffffff', trail: [] };

        this.ball.vx += (Math.random() - 0.5) * 5;
        this.ball.vy -= 4;
      },
      step(dt) {
        for (const rg of this.rings) if (rg.alive) rg.gapStart = normAng(rg.gapStart + rg.rot * dt);
        const b = this.ball;
        const steps = Math.max(4, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 2.5));
        const sub = dt / steps;
        for (let s = 0; s < steps; s++) {
          b.vy += gravity * sub;
          b.x += b.vx * sub;
          b.y += b.vy * sub;

          const dx = b.x - CX, dy = b.y - CY;
          const dist = Math.hypot(dx, dy);
          const ang = Math.atan2(dy, dx);

          for (const rg of this.rings) {
            if (!rg.alive) continue;
            if (Math.abs(dist - rg.r) <= b.r + 2.5) {
              if (inGap(ang, rg.gapStart, rg.gapSize)) {
                // passing through the hole explodes this ring!
                rg.alive = false;
                const col = `hsl(${rg.hue}, 95%, 62%)`;
                b.color = col;
                playBounceNote(5, 0.18, 0.11);
                for (let k = 0; k < 24; k++) {
                  const pa = (k / 24) * Math.PI * 2;
                  addParticles(CX + Math.cos(pa) * rg.r, CY + Math.sin(pa) * rg.r, col, 2, 1.0);
                }
              } else {
                // solid ring: bounce off without exploding
                const nx = (dist < rg.r ? -1 : 1) * (dx / (dist || 1));
                const ny = (dist < rg.r ? -1 : 1) * (dy / (dist || 1));
                b.x = CX + (dx / (dist || 1)) * (dist < rg.r ? rg.r - b.r - 2.6 : rg.r + b.r + 2.6);
                b.y = CY + (dy / (dist || 1)) * (dist < rg.r ? rg.r - b.r - 2.6 : rg.r + b.r + 2.6);
                const vn = b.vx * nx + b.vy * ny;
                if (vn < 0) {
                  b.vx -= 2 * vn * nx;
                  b.vy -= 2 * vn * ny;
                  b.vx *= Math.min(speedBoost, 1.02);
                  b.vy *= Math.min(speedBoost, 1.02);

                  hitBounce();
                  playBounceNote();
                  addParticles(b.x, b.y, `hsl(${rg.hue}, 95%, 62%)`, 4, 0.6);

                break;
              }
            }
          }

          if (dist > R * 1.4) {
            flash = 0.35;
            playBurst(240);
            this.init();
            return;
          }
        }
        pushTrail(b);
      },

    // 6. DUPLICATION (no limit — fills until arena is packed full)
    {
      name: 'duplication',
      extraLbl: 'balls',
      init() {
        this.balls = [{ x: CX, y: CY - 30, vx: 4.5, vy: -2.8, r: 9, color: '#6cf0ff', trail: [] }];
        this.full = false;
      },
      isArenaFull() {
        let sumR2 = 0;
        for (const b of this.balls) sumR2 += b.r * b.r;
        return sumR2 >= R * R * 0.95;
      },
      onClick(mx, my) {
        if (!this.full) {
          this.balls.push({ x: mx, y: my, vx: (Math.random() - 0.5) * 8, vy: -4, r: 9, color: `hsl(${Math.random() * 360}, 95%, 65%)`, trail: [] });
          this.full = this.isArenaFull();
        }
      },
      step(dt) {
        const added = [];
        this.full = this.isArenaFull();
        const steps = 4;
        const sub = dt / steps;

        for (let s = 0; s < steps; s++) {
          for (const b of this.balls) {
            b.vy += gravity * sub;
            b.x += b.vx * sub;
            b.y += b.vy * sub;

            const dx = b.x - CX, dy = b.y - CY;
            const dist = Math.hypot(dx, dy);
            if (dist + b.r >= R) {
              const nx = -dx / (dist || 1), ny = -dy / (dist || 1);
              b.x = CX - nx * (R - b.r);
              b.y = CY - ny * (R - b.r);
              const vn = b.vx * nx + b.vy * ny;
              if (vn < 0) {
                b.vx -= 2 * vn * nx;
                b.vy -= 2 * vn * ny;
                clampSpd(b, 15);
                if (-vn > 0.7) {
                  hitBounce();
                  playBounceNote();
                  if (!this.full && added.length < 40) {
                    const sp = Math.max(4.2, Math.hypot(b.vx, b.vy));
                    const a = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 0.7;
                    added.push({
                      x: b.x + nx * 2,
                      y: b.y + ny * 2,
                      vx: Math.cos(a) * sp,
                      vy: Math.sin(a) * sp,
                      r: 8.5,
                      color: `hsl(${(hue += 7) % 360}, 95%, 65%)`,
                      trail: []
                    });
                  }
                }
              }
            }
          }

          // fast spatial hash for ball-ball packing collisions
          const cellSize = 20;
          const grid = new Map();
          for (let i = 0; i < this.balls.length; i++) {
            const b = this.balls[i];
            const gx = Math.floor(b.x / cellSize);
            const gy = Math.floor(b.y / cellSize);
            const key = (gx << 16) ^ gy;
            let list = grid.get(key);
            if (!list) { list = []; grid.set(key, list); }
            list.push(i);
          }

          for (let i = 0; i < this.balls.length; i++) {
            const a = this.balls[i];
            const gx = Math.floor(a.x / cellSize);
            const gy = Math.floor(a.y / cellSize);
            for (let ox = -1; ox <= 1; ox++) {
              for (let oy = -1; oy <= 1; oy++) {
                const list = grid.get(((gx + ox) << 16) ^ (gy + oy));
                if (!list) continue;
                for (const j of list) {
                  if (j <= i) continue;
                  const b = this.balls[j];
                  const dx = b.x - a.x, dy = b.y - a.y;
                  const dist = Math.hypot(dx, dy);
                  const minD = a.r + b.r;
                  if (dist > 0 && dist < minD) {
                    const nx = dx / dist, ny = dy / dist;
                    const overlap = (minD - dist) * 0.55;
                    a.x -= nx * overlap;
                    a.y -= ny * overlap;
                    b.x += nx * overlap;
                    b.y += ny * overlap;
                    const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
                    const p = dvx * nx + dvy * ny;
                    if (p > 0) {
                      a.vx -= p * nx * 0.985;
                      a.vy -= p * ny * 0.985;
                      b.vx += p * nx * 0.985;
                      b.vy += p * ny * 0.985;
                    }
                  }
                }
              }
            }
          }
        }

        if (added.length) {
          this.balls.push(...added);
          this.full = this.isArenaFull();
        }
        const tLen = this.balls.length > 80 ? 3 : 16;
        for (const b of this.balls) pushTrail(b, tLen);
      },
      draw() {
        drawHookTitle(
          'every bounce duplicates the ball',
          this.full ? `arena full! (${this.balls.length} balls)` : 'no limit — fills until arena is full'
        );
        const col = `hsl(${hue % 360}, 90%, 62%)`;
        ctx.save();
        ctx.strokeStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = 14;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(CX, CY, R, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        for (const b of this.balls) drawBall(b);
      },
      getExtra() { return this.full ? `${this.balls.length} (full)` : this.balls.length; },
      getSpeed() { return this.balls[0] ? Math.hypot(this.balls[0].vx, this.balls[0].vy).toFixed(1) : '0'; }
    },

  // --- ui setup ---
  let current = scenarios[0];

  function selectScenario(idx) {
    current = scenarios[idx];
    document.querySelectorAll('.sc-pill').forEach((p, i) => p.classList.toggle('active', i === idx));
    hudExtraLbl.textContent = current.extraLbl;
    reset();
  }

  scenarios.forEach((sc, i) => {
    const btn = document.createElement('button');
    btn.className = 'sc-pill' + (i === 0 ? ' active' : '');
    btn.textContent = `${i + 1}. ${sc.name}`;
    btn.addEventListener('click', () => {
      ensureAudio();
      selectScenario(i);
    });
    pillBar.appendChild(btn);
  });

  function reset() {
    bounces = 0;
    bounceTimes = [];
    particles = [];
    flash = 0;
    noteIdx = 0;
    current.init();
  }

  playBtn.addEventListener('click', () => {
    ensureAudio();
    paused = !paused;
    playBtn.textContent = paused ? 'resume' : 'pause';
  });

  resetBtn.addEventListener('click', () => {
    ensureAudio();
    reset();
  });

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'sound: on' : 'sound: off';
    if (soundOn) ensureAudio();
  });

  gearBtn.addEventListener('click', () => {
    settingsPop.classList.toggle('open');
  });

  gravSlider.addEventListener('input', () => {
    gravity = parseFloat(gravSlider.value);
    gravLbl.textContent = gravity.toFixed(2);
  });

  boostSlider.addEventListener('input', () => {
    speedBoost = parseFloat(boostSlider.value);
    boostLbl.textContent = speedBoost.toFixed(2) + 'x';
  });

  timeSlider.addEventListener('input', () => {
    timeScale = parseFloat(timeSlider.value);
    timeLbl.textContent = timeScale.toFixed(2) + 'x';
  });

  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    settingsPop.classList.remove('open');
    if (current.onClick) current.onClick(e.clientX, e.clientY);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      playBtn.click();
    } else if (e.key >= '1' && e.key <= String(scenarios.length)) {
      ensureAudio();
      selectScenario(parseInt(e.key, 10) - 1);
    } else if (e.key.toLowerCase() === 'r') {
      reset();
    }
  });

  // --- main loop ---
  current.init();
  let lastT = performance.now();

  function loop(now) {
    const rawDt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    const dt = rawDt * 60 * timeScale;

    if (!paused) {
      current.step(dt);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.08 * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      flash *= 0.9;
    }

    ctx.clearRect(0, 0, W, H);
    current.draw();

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
    }

    hudBounces.textContent = bounces.toLocaleString();
    hudBps.textContent = getBps();
    hudSpeed.textContent = current.getSpeed();
    hudExtra.textContent = current.getExtra();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
